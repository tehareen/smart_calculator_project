<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Calculator</title>

  <!-- Google Font (fallback fonts are set in style.css) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS from the official CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Our own styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Bootstrap: full-height flex container that centres the calculator -->
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="row w-100 justify-content-center">
      <div class="col-12 col-sm-9 col-md-6 col-lg-5 col-xl-4">

        <!-- Calculator card -->
        <section class="calculator" aria-label="Smart Calculator">

          <h1 class="calculator-title">Smart Calculator</h1>

          <!-- Displays -->
          <div class="display" aria-live="polite">
            <div id="secondary-display" class="display-secondary"></div>
            <div id="main-display" class="display-main">0</div>
          </div>

          <!-- Keypad (CSS Grid, 4 columns). data-action tells JavaScript what each button does -->
          <div class="keypad">
            <button class="btn calc-btn key-function" data-action="allclear" aria-label="All clear">AC</button>
            <button class="btn calc-btn key-function" data-action="clear" aria-label="Clear entry">C</button>
            <button class="btn calc-btn key-function" data-action="backspace" aria-label="Backspace">&#9003;</button>
            <button class="btn calc-btn key-operator" data-action="operator" data-value="/" aria-label="Divide">&divide;</button>

            <button class="btn calc-btn key-number" data-action="number" data-value="7">7</button>
            <button class="btn calc-btn key-number" data-action="number" data-value="8">8</button>
            <button class="btn calc-btn key-number" data-action="number" data-value="9">9</button>
            <button class="btn calc-btn key-operator" data-action="operator" data-value="*" aria-label="Multiply">&times;</button>

            <button class="btn calc-btn key-number" data-action="number" data-value="4">4</button>
            <button class="btn calc-btn key-number" data-action="number" data-value="5">5</button>
            <button class="btn calc-btn key-number" data-action="number" data-value="6">6</button>
            <button class="btn calc-btn key-operator" data-action="operator" data-value="-" aria-label="Subtract">&minus;</button>

            <button class="btn calc-btn key-number" data-action="number" data-value="1">1</button>
            <button class="btn calc-btn key-number" data-action="number" data-value="2">2</button>
            <button class="btn calc-btn key-number" data-action="number" data-value="3">3</button>
            <button class="btn calc-btn key-operator" data-action="operator" data-value="+" aria-label="Add">+</button>

            <button class="btn calc-btn key-function" data-action="plusminus" aria-label="Change sign">+/&minus;</button>
            <button class="btn calc-btn key-number" data-action="number" data-value="0">0</button>
            <button class="btn calc-btn key-number" data-action="decimal" aria-label="Decimal point">.</button>
            <button class="btn calc-btn key-function" data-action="sqrt" aria-label="Square root">&radic;</button>

            <button class="btn calc-btn key-function" data-action="operator" data-value="%" aria-label="Modulus">%</button>
            <button class="btn calc-btn key-equals" data-action="equals" aria-label="Equals">=</button>
          </div>

        </section>
      </div>
    </div>
  </main>

  <!-- Our JavaScript (at the end so the buttons already exist when it runs) -->
  <script src="script.js"></script>
</body>
</html>
